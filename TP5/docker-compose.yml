---
# docker-compose.yml
# Stack Airflow + PostgreSQL + MinIO pour le TP5
# Usage : docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Indique à Airflow où chercher les requirements à installer au démarrage
    _PIP_ADDITIONAL_REQUIREMENTS: ''
    # Connexions injectées via URI
    AIRFLOW_CONN_WEATHER_POSTGRES: postgresql://weather:weather@postgres/weather
    AIRFLOW_CONN_WEATHER_MINIO: >-
      aws://minioadmin:minioadmin@?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1
    # Variables d'env pour boto3
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: weather-raw
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./logs:/opt/airflow/logs
    # requirements.txt monté → installé une seule fois dans l'image custom
    - ./requirements.txt:/requirements.txt
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks:
    - airflow-net

services:

  # ── MinIO — Object Store S3-compatible ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console UI → http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    networks:
      - airflow-net

  # ── MinIO init : crée le bucket au démarrage ────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/weather-raw &&
        echo 'Bucket weather-raw OK'
      "
    networks:
      - airflow-net
    restart: "no"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init_postgres.sh:/docker-entrypoint-initdb.d/init_postgres.sh
      - ./sql/init.sql:/sql/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    networks:
      - airflow-net

  # ── Airflow init ─────────────────────────────────────────────────────────────
  # Ce service s'exécute UNE SEULE FOIS (restart: no) :
  #   1. installe les dépendances depuis requirements.txt
  #   2. migre la DB
  #   3. crée l'user admin
  # Les autres services (webserver, scheduler) attendent sa complétion via
  # depends_on condition: service_completed_successfully
  airflow-init:
    <<: *airflow-common
    command: bash -c "
        echo '>>> Installation des dépendances...' &&
        pip install -r /requirements.txt --quiet &&
        echo '>>> Migration de la base Airflow...' &&
        airflow db migrate &&
        echo '>>> Création de l utilisateur admin...' &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
        echo '>>> Initialisation des Variables Airflow...' &&
        bash /scripts/init_variables.sh &&
        echo '>>> Init terminé.'
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./logs:/opt/airflow/logs
      - ./requirements.txt:/requirements.txt
      - ./scripts:/scripts
    restart: "no"

  # ── Airflow Webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    # Installe les deps PUIS démarre — garanti que boto3 est présent
    command: >
      bash -c "
        pip install -r /requirements.txt --quiet &&
        airflow webserver
      "
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully   # ← attend que l'init soit fini
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - airflow-net

  # ── Airflow Scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: >
      bash -c "
        pip install -r /requirements.txt --quiet &&
        airflow scheduler
      "
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully   # ← attend que l'init soit fini
    restart: unless-stopped
    networks:
      - airflow-net

volumes:
  postgres-data:
  minio-data:

networks:
  airflow-net:
    driver: bridge
